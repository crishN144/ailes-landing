<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AILES — Logo System v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #2a2520; min-height: 100vh; font-family: 'Inter Tight', sans-serif; -webkit-font-smoothing: antialiased; }
#root { min-height: 100vh; }
input[type=range] { accent-color: #7B2D26; cursor: pointer; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<script type="text/babel">
const { useState } = React;

// ── Palette ──────────────────────────────────────────────────────────────────
const C = {
  claret:  '#7B2D26',
  claretD: '#5A1F1A',
  cream:   '#F5EFE0',
  creamD:  '#EBE3D0',
  black:   '#0D0D0A',
  ink:     '#16140F',
  red:     '#C8321F',
  ash:     '#8C857A',
};

// ── ChevronTile ───────────────────────────────────────────────────────────────
function ChevronTile({ size = 220, bg = C.cream, fg = C.black, apexDot = C.black, radius = 0.22, shadow = true }) {
  return (
    <div style={{
      width: size, height: size, flexShrink: 0,
      borderRadius: size * radius,
      background: bg,
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxShadow: shadow
        ? `0 ${size*.04}px ${size*.10}px rgba(0,0,0,.22),0 ${size*.012}px ${size*.03}px rgba(0,0,0,.10),inset 0 1px 0 rgba(255,255,255,.10)`
        : 'none',
    }}>
      <svg viewBox="0 0 100 100" width="76%" height="76%" style={{ display: 'block', overflow: 'visible' }}>
        <path d="M 12 78 L 50 26 L 88 78 L 70 78 L 50 50 L 30 78 Z" fill={fg} />
        {apexDot && <circle cx="50" cy="22" r="3.2" fill={apexDot} />}
      </svg>
    </div>
  );
}

// ── AilesCaps ─────────────────────────────────────────────────────────────────
function AilesCaps({ size = 200, color = C.cream, tittle = C.red, weight = 700 }) {
  const dotSz = size * 0.11;
  const dotTop = -(dotSz + size * 0.02);
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'baseline',
      fontFamily: "'Inter Tight', sans-serif",
      fontWeight: weight, fontSize: size,
      letterSpacing: '-0.012em', color, lineHeight: 1, userSelect: 'none',
    }}>
      <span>A</span>
      <span style={{ position: 'relative', display: 'inline-block', letterSpacing: 0 }}>
        <span>I</span>
        <span aria-hidden style={{
          position: 'absolute', left: 0, right: 0,
          top: `${dotTop}px`, height: dotSz,
          display: 'flex', justifyContent: 'center', alignItems: 'center',
          pointerEvents: 'none', lineHeight: 0,
        }}>
          <span style={{ display: 'block', width: dotSz, height: dotSz, borderRadius: '50%', background: tittle }} />
        </span>
      </span>
      <span>LES</span>
    </span>
  );
}

// ── Frame ─────────────────────────────────────────────────────────────────────
function Frame({ bg = C.cream, fg = C.ink, children, label, meta, pad = 64 }) {
  return (
    <div style={{
      width: '100%', height: '100%', background: bg, color: fg,
      position: 'relative', overflow: 'hidden',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      padding: pad, boxSizing: 'border-box',
    }}>
      {children}
      {label && <Stamp pos="left" color={fg}>{label}</Stamp>}
      {meta  && <Stamp pos="right" color={fg}>{meta}</Stamp>}
    </div>
  );
}
function Stamp({ pos, color, children }) {
  return (
    <div style={{
      position: 'absolute', bottom: 18, [pos]: 24,
      font: "500 9px 'JetBrains Mono',monospace",
      letterSpacing: '0.24em', textTransform: 'uppercase',
      color, opacity: pos === 'left' ? 0.40 : 0.28,
    }}>{children}</div>
  );
}

// ── Mono tag ──────────────────────────────────────────────────────────────────
function Mono({ children, color = C.cream, opacity = 0.7, sz = 11, tracking = '0.42em' }) {
  return (
    <div style={{ font: `500 ${sz}px 'JetBrains Mono',monospace`, letterSpacing: tracking, textTransform: 'uppercase', color, opacity }}>
      {children}
    </div>
  );
}

// ── Lockup row ────────────────────────────────────────────────────────────────
function LockupRow({ tile, caps, gap = 56 }) {
  return <div style={{ display: 'flex', alignItems: 'center', gap }}>{tile}{caps}</div>;
}

            <div style={{ fontFamily: "'Inter Tight', sans-serif", fontSize: 15, lineHeight: 1.7, color: '#3A322A', maxWidth: 400 }}>

// ═════════════════════════════════════════════════════════════════════════════
//  Artboard card
// ═════════════════════════════════════════════════════════════════════════════
function Artboard({ id, w, h, zoom, label }) {
  const Content = boards[id];
  return (
    <div style={{ display: 'flex', flexDirection: 'column' }}>
      <div style={{
        width: w * zoom, height: h * zoom,
        position: 'relative', overflow: 'hidden',
        boxShadow: '0 4px 24px rgba(0,0,0,.55),0 1px 4px rgba(0,0,0,.3)',
        flexShrink: 0,
      }}>
        <div style={{ width: w, height: h, transform: `scale(${zoom})`, transformOrigin: 'top left' }}>
          <Content />
        </div>
      </div>
      <div style={{
        marginTop: 8,
        font: "400 9px 'JetBrains Mono',monospace",
        letterSpacing: '0.18em', textTransform: 'uppercase', color: '#6A6158',
      }}>{label}</div>
    </div>
  );
}

// ═════════════════════════════════════════════════════════════════════════════
//  Section wrapper
// ═════════════════════════════════════════════════════════════════════════════
function Section({ num, title, sub, children }) {
  return (
    <div style={{ marginBottom: 80 }}>
      <div style={{ marginBottom: 32 }}>
        <div style={{ font: "400 10px 'JetBrains Mono',monospace", letterSpacing: '0.22em', textTransform: 'uppercase', color: C.ash, marginBottom: 6 }}>§ {num}</div>
        <div style={{ fontFamily: "'Inter Tight',sans-serif", fontWeight: 700, fontSize: 22, letterSpacing: '-0.02em', color: '#E8E0D4', marginBottom: 4 }}>{title}</div>
        <div style={{ fontFamily: "'Inter Tight',sans-serif", fontSize: 14, color: '#6A6158' }}>{sub}</div>
      </div>
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 32, alignItems: 'flex-start' }}>
        {children}
      </div>
    </div>
  );
}
